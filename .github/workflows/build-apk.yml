name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 21.4.7075529
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Android SDK, build-tools, NDK
        run: |
          SDK="$ANDROID_SDK_ROOT"
          [ -z "$SDK" ] && SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-31" "build-tools;31.0.0" "ndk;${NDK_VERSION}"
          echo "sdk.dir=$SDK" > projects/NarutoSenki/proj.android-studio/local.properties
          echo "ndk.dir=$SDK/ndk/${NDK_VERSION}" >> projects/NarutoSenki/proj.android-studio/local.properties
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          chmod +x gradlew
          ./gradlew :narutosenki:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-debug-apk
          path: projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
